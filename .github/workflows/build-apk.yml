name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # GitHub's Ubuntu runners already ship the Android SDK; only the licenses need accepting.
      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true

      # Caches the Gradle distribution and dependencies; the build itself
      # runs through the pinned wrapper (./gradlew, Gradle 8.9).
      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
